name: _model_fallback
title: Model Fallback System
description: >
  Multi-cycle model fallback: when the primary model rate-limits, times
  out, or errors, rotate through the fallback candidates with cooldown
  management, permanent-failure detection, and adaptive warm/cold
  timeouts. Adds optional, independently toggleable resilience layers —
  a utility-call timeout guard, a context-size guard, and a langchain
  v0->v1 import shim. (The server-side WebUI extensions cache moved to
  the ui_loader_optimizer plugin in v2.6.6.) Self-contained; no official
  agent-zero file is modified.
version: 2.6.6
settings_sections:
  - agent
  - developer
per_project_config: true
per_agent_config: true
