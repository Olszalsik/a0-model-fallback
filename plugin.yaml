name: model_fallback
title: Model Fallback System
description: >
  Multi-cycle model fallback: when the primary model rate-limits, times
  out, or errors, rotate through the fallback candidates with cooldown
  management, permanent-failure detection, and adaptive warm/cold
  timeouts. v2.8.0 covers the v2.10+ turn path (call_chat_model_turn —
  the main agent loop) with its own cascade plus a handle_exception
  safety net for transient provider errors. Adds optional,
  independently toggleable resilience layers — a utility-call timeout
  guard, a context-size guard, and a langchain v0->v1 import shim.
  (The server-side WebUI extensions cache moved to the
  ui_loader_optimizer plugin in v2.6.6.) v3.0.0 unifies the utility and
  chat rotation cascades into ONE engine (_run_rotation_cascade) behind
  two thin adapters, eliminating the "fixed in one cascade, missed in
  the other" bug class. v3.1.0 adds conservative latency-adaptive cold
  timeouts: per-label observed p95 x margin, clamped to a floor and the
  config base — never applied to routers or unlimited_paid labels.
  v3.3.0 merges the standalone _asyncio_guard and _extension_import_guard
  plugins in as two more independently toggleable resilience layers, and
  fixes the install site for both: a plugin ``hooks.py`` is only ever
  imported lazily by ``call_plugin_hook``, so an import-time patch (the
  asyncio guard) never ran at boot, and an ``agent_init`` install (the
  import guard) could not protect its own cold-cache enumeration. Both
  now install from the ``startup_migration`` extension point, the earliest
  hook that reliably fires. The import guard also stops mirroring
  upstream ``load_classes_from_folder`` and instead shims
  ``modules.import_module``, so it cannot drift.
  Self-contained; no official agent-zero file is
  modified.
version: 3.3.0
settings_sections:
  - agent
  - developer
per_project_config: true
per_agent_config: true
