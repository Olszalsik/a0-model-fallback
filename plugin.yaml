name: model_fallback
title: Model Fallback System
description: >
  Multi-cycle model fallback for Agent Zero: when a provider rate-limits,
  times out or errors, rotate through fallback candidates using shared
  cooldowns, permanent-failure detection, latency-learned warm/cold
  timeouts, background recovery probes, and an extended-retry mode for
  hour-long quota resets. Covers the chat, utility and main-loop turn
  paths. Optional, independently toggleable layers: a utility-call
  timeout guard, a context-size guard, a langchain v0->v1 import shim, an
  asyncio read-ready guard, and a guard that quarantines a broken
  extension file instead of aborting the whole extension point.
  Self-contained; modifies no official agent-zero file.
version: 3.4.1
settings_sections:
  - agent
  - developer
per_project_config: true
per_agent_config: true
