fallback_max_cycles: 4
fallback_cycle_delay: 15.0
fallback_attempt_delay: 3.0
fallback_timeout_s: 300
fallback_utility_timeout_s: 300

# When true, if a full pass through all candidate models produces only
# permanent failures (auth/quota/model-not-found), the plugin raises
# extended-retry mode after the first cycle instead of cycling
# `max_cycles` times. This avoids the "switching to [N/2]" / "cycling"
# log spam when every configured model is broken. Set to false to keep
# the old behavior of always exhausting max_cycles first.
early_exit_on_all_permanent: true

# Extended retry — infinite cycle for long cooldown resets (e.g. Ollama 5h rate limit, daily API credit reset).
# After the normal attempt budget is exhausted, the plugin enters "extended retry mode":
#   Phase A: initial_cycle_attempts → wait phase_a_delay → initial_cycle_attempts → wait phase_a_delay
#   Phase B: wait phase_b_delay → initial_cycle_attempts → wait phase_b_delay → initial_cycle_attempts
#   Then resets to Phase A and repeats forever.
# Set extended_retry_enabled: false to keep the old behavior (hard stop after 60 attempts).
extended_retry_enabled: true
phase_a_delay_s: 900        # 15 min — covers short rate-limit windows
phase_b_delay_s: 3600       # 60 min (1 hour cap) — covers daily credit resets / weekly limits
initial_cycle_attempts: 20  # how many attempts in each extended cycle (3-4 normal cycles worth)

# --- Responses -> chat-completions fallback (options B + D) -------------------
# The transport defaults to /v1/responses. Some OpenAI-compatible providers
# (notably ollama.com for ":cloud" models) 500 on /v1/responses while their
# /v1/chat/completions works. These knobs keep the fleet resilient without
# editing tracked files (so the fix survives agent-zero updates).
#
# Option B (proactive): force chat-completions for any provider in
#   force_chat_completions_providers, any model whose name contains a pattern
#   in force_chat_completions_patterns, or any model whose api_base contains a
#   substring in force_chat_completions_api_bases.
#   The api_base matcher is the reliable one: OpenAI-compatible vendors
#   (ollama_cloud, a0_venice, openrouter, ...) all share litellm_provider
#   "openai", and the fallback wrapper built by build_fallback_wrapper carries
#   provider="openai" rather than the agent-zero service name, so the
#   provider-name list cannot match fallback wrappers. api_base (e.g.
#   "https://ollama.com/v1") is stable and present on both primary and
#   fallback wrappers, and uniquely IDs the upstream that 500s on
#   /v1/responses.
# Option D (reactive): if responses_5xx_retry_enabled, a model that still 5xxs
#   on the Responses path is retried ONCE with chat-completions, then marked
#   sticky so all later turns force chat proactively.
force_chat_completions_providers:
  - ollama_cloud
force_chat_completions_patterns:
  - ":cloud"
  - "ollama_cloud/"
force_chat_completions_api_bases:
  - "ollama.com"
responses_5xx_retry_enabled: true

# --- Memory plugin resilience (merged from memory_fix plugin v1.0.0) -----
# Patches applied at monologue_start to prevent TimeoutError from killing
# the agent loop when the built-in _memory plugin's recall task times out.
# Applied silently; never crashes the agent loop from our fixes.
memory_recall_timeout_s: 90          # was 30 in core; our patch enforces this
memory_memorize_max_chars: 50000     # was 80000 in core; prevents utility model context overflow
memory_recall_delayed: true          # make recall deferred so the agent doesn't block on slow searches
memory_memorize_consolidation: false # disable to reduce memorize CPU/IO bursts

# --- v2.5 WebUI feature toggles ----------------------------------------
# Top-level on/off switches. The WebUI binds to these flat keys
# (e.g. ``context.settings.utility_timeout_guard_enabled``). The
# runtime helpers also still honour each piece's nested
# ``<piece>.enabled`` for back-compat, but the WebUI surface
# exposes only the top-level switches. See AGENTS.md "WebUI
# configuration" for the migration story and what to do if
# upstream agent-zero adds an equivalent to one of these.
utility_timeout_guard_enabled: true     # v2.2 — outer timeout on call_utility_model
# housekeeping_enabled and second_pulse_path_enabled are still
# recognised by the toggle resolver (see helpers/toggles.py) for
# back-compat with hand-edited configs, but the corresponding
# extension and helper were removed in v2.5. Saving a value here
# is harmless; nothing on the runtime side reads it.
housekeeping_enabled: false             # v2.5 — REMOVED, kept as no-op for back-compat
second_pulse_path_enabled: false        # v2.5 — REMOVED, kept as no-op for back-compat
context_size_guard_enabled: false       # v2.3 — opt-in history trim on ContextOverflow spiral
langchain_compat_enabled: true          # v2.4 — v0 -> v1 import shim (default ON)
primary_skip_enabled: true              # v2.5.1 — escalate primary cooldown after N strikes

# --- v2.2 Resilience Layer ---------------------------------------------
# Three independent pieces; each is a no-op when ``enabled: false``.
# See AGENTS.md for the full design and migration notes (what to do
# if upstream agent-zero adds an equivalent feature).

# Outer timeout guard on call_utility_model. Wraps the cascaded
# method (the cascade itself stays unchanged) in
# asyncio.wait_for so a hung utility call (typically ollama on CPU)
# cannot freeze the agent loop indefinitely. On timeout, closes the
# inner litellm coroutine chain via memory_hardening (best-effort,
# lazy import) and raises RepairableException so the LLM is told the
# utility failed.
utility_timeout_guard:
  enabled: true
  default_timeout_s: 60          # was 90; lowered 2026-07-23 -- with 6
                                 # fallback candidates the cascade can route
                                 # around a hung primary in ~12s, so a 60s
                                 # ceiling cuts full-cycle wall time from
                                 # ~7 min to ~5 min on primary outages
                                 # (e.g. 22:50:21 "consecutive=2" took
                                 # 14+ min in the live log). Still gives
                                 # cold-start 6x headroom (first a0_venice
                                 # call ~10s, subsequent ~1.2s per the
                                 # 2026-07-21 repro). Hard cap below.
  max_wait_s: 180                # hard cap; kept at 180 even with the
                                 # 60s default so a user override of
                                 # default_timeout_s=120 in their preset
                                 # isn't silently clamped (utility_timeout.py:163
                                 # does min(max(default_to, 0), max_wait)).
  jitter_s: 1.0                  # 0-jitter_s of random spread so concurrent agents don't lockstep
  close_inner_on_timeout: true   # best-effort litellm-internal coroutine cleanup

# --- v2.5.1 Primary-skip-after-N-strikes (added 2026-07-23) --------------
# If the primary model (cascade candidate 0) fails ``primary_skip_strikes``
# times in a row, the plugin escalates its cooldown to
# ``primary_skip_cooldown_s`` so the cascade routes around it instead of
# paying the 60s timeout tax on every cycle. Without this, a hung
# primary produces 60s+60s+60s = 3 min of wasted wall time per cascade
# rotation even though fallbacks [1..N-1] could return in ~12s.
#
# The counter resets on ANY successful call (primary recovered OR
# fallback succeeded) -- so a single successful fallback means the
# next primary attempt is no longer a "consecutive failure". A
# quota-refreshed primary is naturally retried when its cooldown
# expires; if it's still hung, the counter ticks up again and the
# cooldown is escalated further. The escalation only ever EXTENDS the
# cooldown (never shortens), so a 5-min rate-limit cooldown on the
# primary isn't lost.
#
# This is a per-call counter (reset on every utility/chat call), not
# a persistent one. So a container restart fully resets the
# state -- which is correct, because the cooldown store itself is
# in-memory.
primary_skip_enabled: true
primary_skip_strikes: 2
primary_skip_cooldown_s: 120    # 2 min (lowered from 600s on 2026-07-27,
                                # v2.5.2). 600s was over-locking the
                                # primary when it had recovered in ~2 min,
                                # which is the common case for short-lived
                                # upstream hiccups. 120s still covers one
                                # full pass through 6 candidates at 60s
                                # timeout each (6 min) for a genuinely
                                # hung primary, but routes around a
                                # temporarily-hung primary within one
                                # cascade rotation.
primary_strike_decay_s: 300     # v2.8.6 (Z): time-decay window (s) for the
                                # strike counter. A primary failure older
                                # than this no longer counts toward
                                # primary_skip_strikes, so two isolated
                                # failures hours apart don't lock the
                                # primary out for primary_skip_cooldown_s.
                                # 0 disables the decay (pre-v2.8.6
                                # behavior: strikes never expire).

# --- v2.9.0 Background recovery probes (added 2026-09-03) ------------------
# A cooled-down label is normally re-probed only by REAL agent traffic --
# the first post-cooldown call pays the full timeout/429 again. When a
# cooldown is booked, the plugin remembers the failed candidate's model
# wrapper and a background task pings the label cheaply (same transport,
# api_key and provider kwargs as the real path) every
# recovery_probe_interval_s. A successful probe clears the cooldown EARLY
# and marks the label healthy cross-agent. Bounded burn: at most
# max_targets_per_cycle probes per sweep, only labels whose REMAINING
# cooldown exceeds min_cooldown_s, and dead-marked labels are never
# probed (recovery there needs a user action, e.g. a fixed API key).
recovery_probe_enabled: true
recovery_probe_interval_s: 45    # sweep cadence; clamped >= 10s
recovery_probe_min_cooldown_s: 120  # only probe cooldowns longer than this
recovery_probe_timeout_s: 15     # per-probe budget; clamped to 5-60s
recovery_probe_max_targets_per_cycle: 2  # max probes per sweep (quota guard)

# --- v2.5.2 Rate-limit cooldown tuning (added 2026-07-27) -----------------
# When a rate-limit error (HTTP 429) has no Retry-After header (e.g.
# NVIDIA NIM's plain {"status":429,"title":"Too Many Requests"}), the
# plugin uses this cooldown duration instead of guessing. Was hardcoded
# 300s (5 min) in v2.5.1; lowered default to 30s because free-tier
# endpoints (NVIDIA NIM, OpenRouter free models, a0_venice, etc.) recover
# in 20-40s in practice. The 300s default was over-locking healthy
# endpoints after a single shared-agent 429 -- a cascade sharing the
# process with multiple agents would lock out all candidates within a
# few cycles because every concurrent agent's first failure set a
# 5-min cooldown on a different endpoint.
#
# Raise this back up if your provider really does need the longer wait.
# Clamped to [10s, 3600s] at runtime.
rate_limit_no_retry_after_cooldown_s: 30

# --- v2.5.2 Cross-agent healthy-label reset (added 2026-07-27) ----------
# When any agent's cascade succeeds on a model label, that label is
# marked "healthy" for `health_horizon_s`. Other agents' cooldowns for
# the same label are eligible to be cleared (only-cleared, never
# overwritten) on their next cascade iteration. Fixes the multi-agent
# case where one agent's rate-limit cooldown was locking out other
# agents that needed the same endpoint right now.
#
# Only-cleared-never-overwritten invariant: if a fresh "broken" cooldown
# for `label` exists from a different agent within the horizon, the
# broken signal wins. The healthy signal just means the cascade retries
# `label` sooner once that active cooldown expires -- it does NOT
# shorten the cooldown. See fallback.py:_maybe_clear_cooldown_for_healthy_label.
#
# The horizon is short (60s) so a stale "healthy" signal cannot
# override a fresh "broken" cooldown from a different agent, but long
# enough to span at least one cascade cycle. Set to 0 to disable
# (clamped to a minimum of 5s at runtime).
health_horizon_s: 60

# --- v2.6.2 Router capacity class (omniroute/*) ---------------------------
# OmniRoute fronts many upstreams and rotates automatically (4-tier internal
# fallback); a 429/5xx from the gateway does NOT mean the underlying model is
# broken -- the next call re-routes to a healthy tier. A 429 skips cooldown
# entirely (the router is retried on the next cascade pass). A 5xx/transient
# error gets this short spacing so we don't hammer a 5xx storm but retry
# within seconds instead of the 60-120s a normal endpoint would get. Clamped
# to [0, 60] at runtime. Set to 0 to skip the 5xx cooldown entirely (retry
# immediately).
router_cooldown_s: 5

# --- v2.6.7 Router detection + router-class wait tuning --------------------
# Extends the v2.6.2 router capacity class. The original detection was
# prefix-only on the cascade label: a candidate was "router" iff its label
# started with one of `_DEFAULT_ROUTER_PROVIDERS` (default ["omniroute"]).
# That missed the common case where the OmniRoute primary is registered
# under `litellm_provider: openai` (see conf/model_providers.yaml), so its
# cascade label is `openai/auto/best-coding` — prefix "openai" — and it was
# mis-classified as `free_per_minute`. A single timeout on that primary
# then set a 300s cooldown (the `free_per_minute` timeout cooldown), which
# is the "300 second wait" the user hit: the cascade refused to retry the
# gateway for 5 min even though the gateway self-heals in seconds.
#
# Two matchers, either wins (OR):
#   router_label_prefixes — prefix match on the cascade label (A1).
#     Default ["omniroute"]. Add "openai/auto" here to also classify the
#     litellm_provider-aliased OmniRoute primary by label.
#   router_api_bases — substring match on the candidate's api_base (A2).
#     This is the durable matcher: the provider config injects
#     `api_base: http://host.docker.internal:8080/v1` onto the wrapper kwargs
#     (models.py:_merge_provider_defaults), and that host:port is stable
#     regardless of which litellm_provider prefix the label carries.
#     Default covers the 5 common gateway host spellings on port 8080.
# Set either list to [] to disable that matcher.
router_label_prefixes:
  - omniroute
router_api_bases:
  - host.docker.internal:8080
  - localhost:8080
  - 127.0.0.1:8080
  - 0.0.0.0:8080
  - gateway.docker.internal:8080

# --- v2.6.7 Router-class timeout cooldown (Fix B) -------------------------
# Once a candidate is correctly classified as router-class, what does a
# *timeout* (not a 429/5xx) cost? For a normal endpoint a timeout means
# "this model is hung, don't retry for a while" → the free_per_minute
# 300s cooldown. For a self-healing gateway a timeout usually means "the
# tier the gateway picked is slow/cold, the next call re-routes" → a long
# cooldown just throws away the gateway's own recovery. With
# router_timeout_no_cooldown: true (default), a pure asyncio.TimeoutError
# (no HTTP status) on a router-class candidate sets NO cooldown — the
# cascade retries it on the next pass. Set false to fall back to
# router_timeout_cooldown_s.
router_timeout_no_cooldown: true
router_timeout_cooldown_s: 0.0

# --- v2.6.7 Router-class cycle-backoff cap (Fix C) -------------------------
# Continuous fallback + exponential backoff compounds the wait: a router
# primary in a stuck cycle multiplies its cycle sleep up to
# `max_cycle_delay_s` (user default 300s). For a router primary this cap
# is overridden by `router_max_cycle_delay_s` so the cycle backs off at
# most 30s instead of 300s. The gateway self-heals fast; a 5-min backoff
# just adds dead wall time. Set to a value >= max_cycle_delay_s to disable
# the override and use the global cap. Clamped to [0, 3600] at runtime.
router_max_cycle_delay_s: 30.0

# --- v2.6.7 Router-class per-call timeout headroom (Fix D) -----------------
# Router-class candidates are EXEMPT from the warm fast-path ceiling (see
# cascade_warm_timeout_s) — they always use the cold base ceiling. This
# knob adds (or sets) headroom on top of the cold base for router-class
# calls only. 0.0 = use the cold base unchanged (legacy). A small positive
# value gives a self-healing gateway extra seconds to re-route a slow
# tier before the cascade times it out and moves on.
router_call_timeout_s: 0.0

# --- v2.7.0 Router cold-call warm-up budget ---------------------------------
# When 3+ concurrent agents exhaust the gateway's free pool, OmniRoute must
# re-route to a fresh upstream and the warm-up (probing rate-limited/dead
# slugs before landing on a working one) routinely exceeds the utility cold
# base (60s). The cascade then died a "timed out after 60s" death every
# cycle. This knob gives a COLD router call (no success within the warm
# window) its own larger per-call timeout, so the warm-up can finish; once a
# call succeeds the label is warm and the fast cold base resumes. 0 disables
# (-> pre-v2.7.0 behavior). Only reaches router-class candidates.
router_cold_call_timeout_s: 150.0

# --- v2.6.8 Pure-timeout cooldown + paid warm-path exemption ----------------
# A *pure* timeout (asyncio.TimeoutError / TimeoutError with NO HTTP status
# code) used to fall through to the conservative 300s unknown-error cooldown.
# But a slow call is not a broken model: the request was still in flight and
# the next attempt often succeeds. `timeout_cooldown_s` (default 45s) caps
# the cooldown for pure timeouts only -- per-HTTP-status cooldowns (429,
# 500, etc. via _DEFAULT_COOLDOWNS_S) are unchanged. Applies to non-router
# labels; router-class labels keep their own `router_timeout_*` knobs above.
# Set to a higher value (e.g. 120) if you want pure timeouts to back off
# longer; set to ~30 to retry faster. Clamped to >= 0.
timeout_cooldown_s: 45.0

# --- v2.8.4 Malformed-output (format-error) cooldown ------------------------
# When require_json is set and the utility model returns unparseable output
# (DirtyJson can't recover it), the slip used to fall through to the 300s
# unknown-error cooldown -- locking a HEALTHY endpoint out for 5 minutes
# over a stochastic format slip (the model answered fast; connection and
# auth are fine). `format_error_cooldown_s` (default 20s) books a short
# cooldown instead so the cascade rotates for this call but the label is
# retryable on the very next cycle. Bypasses the generic 30s minimum-cooldown
# floor. Set to 0 to disable the booking entirely (pure rotation).
format_error_cooldown_s: 20.0

# --- v2.6.8 unlimited_paid api_base matcher (a0_venice / Agent Zero API) ---
# The paid-model warm-path exemption above only reaches a label that
# _classify_capacity returns ``unlimited_paid`` for. The a0_venice provider
# ("Agent Zero API") is registered with ``litellm_provider: openai``, so its
# cascade label arrives as ``openai/deepseek-v4-flash`` -- the provider-segment
# check (``a0_venice``) never matches and it falls through to
# ``free_per_minute``, which keeps the aggressive 20s warm ceiling. The result
# is the "works once, then drops off" symptom: the 2nd call times out at 20s
# -> 45s cooldown -> the agent stalls.
# This matcher is the durable fix (same shape as v2.6.7's router_api_bases):
# substring match on the candidate's api_base. The default
# ``llm.agent-zero.ai`` is the a0_venice endpoint. Add other paid endpoints
# here when a paid provider also runs through an ``openai``-aliased label.
# Set to [] to disable (falls back to free_per_minute for these labels).
unlimited_paid_api_bases:
  - llm.agent-zero.ai

# --- v2.6 Cascade per-call timeouts (added 2026-07-28) -------------------
# First call to a label (within `cascade_warm_window_s`) gets the legacy
# `fallback_utility_timeout_s` / `fallback_timeout_s` (the cold default).
# Subsequent calls within the window get `cascade_warm_timeout_s`. User-
# set `TIMEOUT=` on the model kwarg still wins (legacy contract).
#
# Why: cloud providers return warm calls in ~1.2s (a0_venice) or 2-5s
# (nvidia_nim). A flat 90-300s timeout on a warm call wastes up to 4
# minutes per candidate when several are hung. The warm shortcut catches
# these fast-path cases while leaving the cold path intact for genuine
# cold starts (DNS, auth, first-byte).
#
# `cascade_warm_window_s: 600` (10 min) is a deliberate margin over the
# 5-min `health_horizon_s` — a label that succeeded once within the
# last 10 min is overwhelmingly likely to still be warm, but if it
# genuinely cooled off (provider outage, network blip), the next call
# just falls back to the cold default. Set warm_window=0 to disable.
#
# v2.6.3: router-class labels (omniroute/* — see `router_cooldown_s` below)
# are EXEMPT from the warm fast-path: they always use the cold base
# ceiling. A self-healing gateway routing free/slow upstream tiers is
# not a fast warm cloud call, and the 20s warm ceiling was timing out
# the OmniRoute utility model (auto/coding:free etc.). Fast routed calls
# still return fast; the ceiling only bites on slow calls.
cascade_warm_timeout_s: 20
cascade_warm_window_s: 600

# --- v2.6 Cascade stagnation amplification (added 2026-07-28) -----------------
# When `cycle_stagnation_threshold` consecutive full cycles complete
# without ANY candidate succeeding (every model still in cooldown),
# multiply the cycle sleep by `cycle_stagnation_factor` to give upstreams
# more time to recover from quota exhaustion. One log line per stagnation
# event, not per cycle. The amplified sleep still respects the
# `max_cycle_delay_s` cap. Set factor=1.0 to disable amplification.
cycle_stagnation_factor: 1.5
cycle_stagnation_threshold: 2

# The standalone event-loop housekeeping loop was removed in v2.5
# (it was a same-day fix that turned into a per-minute respawn log
# line with no user-visible benefit). The ``housekeeping:`` block
# is kept below for back-compat -- existing configs that reference
# it still parse -- but the values are ignored at runtime.
housekeeping:
  enabled: false
  sweep_interval_s: 60.0
  pulse_interval_s: 25.0
  stats_interval_s: 60.0
  stale_threshold_s: 120.0       # ignored; no loop exists to respawn

# --- v2.3 Context Size Guard (opt-in) ------------------------------------
# Trim ``loop_data.history_output`` at message_loop_prompts_after
# when the total char count exceeds ``max_chars``. Prevents the
# "every utility model returns ContextOverflow" death spiral that
# the cascade can't recover from in a single cycle.
#
# Default ``enabled: false`` because aggressive trimming can confuse
# the LLM (it loses the early conversation). Enable when you see
# cascading ContextOverflow errors across all utility candidates;
# the 50000 char default is conservative (~12.5k tokens, well
# within 32k context).
context_size_guard:
  enabled: false
  max_chars: 50000
  min_messages: 2  # never trim below this; the LLM needs the last turn

# --- v2.4 LangChain v1 Import Compatibility (default ON) -----------------
# Shim ``langchain.prompts`` and ``langchain.schema`` (v0 paths)
# to their langchain_core v1 homes via sys.modules at agent_init.
# Fixes ``ModuleNotFoundError: No module named 'langchain.prompts'``
# in docker images that only ship langchain v1.
#
# This is part of the LLM-error-handling surface (v0/v1 interface
# mismatch surfaces as a fatal import error that no cascade can
# recover from), so it lives in this plugin. Default ON because
# v0.x users (who already have the real modules) get a no-op
# install: the shim is skipped when the legacy name is already in
# sys.modules without our sentinel.
langchain_compat:
  enabled: true
